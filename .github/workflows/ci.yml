name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Syntax check (every .py file must parse)
        run: python -m compileall -q .
      - name: Critical lint (undefined names, unreachable code, bad comparisons)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Data-leak guard (real dollars / FEIN / street addresses)
        # Blocks: dollar amounts with cents (>= $1,000 — real figures have cents,
        # examples don't), millions-scale dollars, FEIN-shaped ids, and street
        # addresses. Business findings belong in the owner's vault, data dumps in
        # ~/Library/Logs/Proficient — never in this repo.
        # TEMP exclusion: project-pnl/project_pnl_export.py still carries two real
        # figures in comments — genericize them, then remove the exclusion.
        # -P (PCRE), not -E: \b is dead in macOS git grep's ERE, so -E passes
        # locally while failing here. -P behaves the same on both.
        run: |
          PATTERNS='\$[0-9]{1,3}(,[0-9]{3})+\.[0-9]{2}|\$[0-9]{1,3},[0-9]{3},[0-9]{3}|\b[0-9]{2}-[0-9]{7}\b|\b[0-9]{3,5} [A-Z]{3,}( [A-Z]{3,})* (ROAD|STREET|DRIVE|AVENUE|TRAIL|COURT|LANE|CIRCLE|BOULEVARD)\b'
          if git grep -nP "$PATTERNS" -- ':!.github' ':!*.example.json' ':!project-pnl/project_pnl_export.py'; then
            echo "::error::Real-looking dollar figures, FEIN-shaped ids, or street addresses in tracked files. Genericize them or move the data to the vault / ~/Library/Logs/Proficient."
            exit 1
          fi
          echo "data-leak guard: clean"
      - name: Run tests
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest tests
          else
            echo "No real pytest tests under tests/ yet — skipping until they exist."
          fi

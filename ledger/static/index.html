<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proficient Ledger</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- ── Top bar ─────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="brand-title">Project Ledger</div>
        <div class="brand-sub" id="metaLine">loading…</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="btnExport" title="Export the current table to CSV">Export CSV</button>
      <button class="btn" id="btnRefresh" title="Reload data">Refresh</button>
      <button class="btn icon" id="btnSettings" title="Customize">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabbar">
    <button class="tab" data-tabbtn="overview">Overview</button>
    <button class="tab" data-tabbtn="costs">Costs</button>
    <button class="tab" data-tabbtn="liens">Liens</button>
    <button class="tab" data-tabbtn="vendors">Vendors</button>
  </nav>

  <main class="wrap" id="wrap">
    <div id="errorBanner" class="error-banner" hidden></div>

    <!-- ══════════════ TAB: OVERVIEW ══════════════ -->
    <div class="tab-page" data-tab="overview">

    <!-- ── KPI widgets ──────────────────────────────────────────────── -->
    <section class="widget" id="widget-kpis">
      <div class="widget-head"><h2>Portfolio</h2></div>
      <div class="kpi-row" id="kpiRow"></div>
    </section>

    <!-- ── Needs attention ──────────────────────────────────────────── -->
    <section class="widget" id="widget-attention">
      <div class="widget-head">
        <h2>Needs attention</h2>
        <button class="btn small" id="btnClearRule" hidden>Clear filter</button>
      </div>
      <div class="attn-row" id="attnRow"></div>
    </section>

    <!-- ── Cost mix (summary bar; full tree + pivot live on the Costs tab) ── -->
    <section class="widget" id="widget-costs">
      <div class="widget-head">
        <h2>Cost mix <span class="count" id="costCount"></span></h2>
      </div>
      <div class="costmix" id="costMix"></div>
    </section>

    <!-- ── Margins & burn (from QBO costs) ──────────────────────────── -->
    <section class="widget" id="widget-margins">
      <div class="widget-head">
        <h2>Margins &amp; burn <span class="count" id="marginNote"></span></h2>
      </div>
      <div class="kpi-row" id="marginStats"></div>
      <div class="table-scroll">
        <table class="grid clickable" id="marginTable"><thead></thead><tbody></tbody></table>
      </div>
    </section>

    <!-- ── Division rollup ──────────────────────────────────────────── -->
    <section class="widget" id="widget-divisions">
      <div class="widget-head"><h2>By division</h2></div>
      <div class="table-scroll">
        <table class="grid" id="divTable">
          <thead></thead><tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ── Projects ─────────────────────────────────────────────────── -->
    <section class="widget" id="widget-projects">
      <div class="widget-head">
        <h2>Projects <span class="count" id="projCount"></span></h2>
      </div>
      <div class="filters">
        <input type="search" id="search" placeholder="Search project #, name, builder…" autocomplete="off">
        <select id="fDivision"><option value="">All divisions</option></select>
        <select id="fStatus"><option value="">All statuses</option></select>
        <select id="fCategory"><option value="">All categories</option></select>
        <label class="chk"><input type="checkbox" id="fActive"> Active only</label>
      </div>
      <div class="table-scroll">
        <table class="grid clickable" id="projTable">
          <thead></thead><tbody></tbody>
        </table>
      </div>
    </section>

    </div><!-- /tab: overview -->

    <!-- ══════════════ TAB: COSTS (pivot — code → jobs) ══════════════ -->
    <div class="tab-page" data-tab="costs" hidden>
      <section class="widget">
        <div class="widget-head"><h2>Cost type ▸ job type <span class="count">— click a code to see every job that spent it</span></h2></div>
        <div class="table-scroll">
          <table class="grid clickable" id="costTreeTable"><thead></thead><tbody></tbody></table>
        </div>
      </section>
      <section class="widget" id="codeJobsWidget" hidden>
        <div class="widget-head"><h2 id="codeJobsTitle">Jobs</h2></div>
        <div class="table-scroll">
          <table class="grid clickable" id="codeJobsTable"><thead></thead><tbody></tbody></table>
        </div>
      </section>
    </div><!-- /tab: costs -->

    <!-- ══════════════ TAB: LIENS (collections worklist) ══════════════ -->
    <div class="tab-page" data-tab="liens" hidden>
      <section class="widget">
        <div class="widget-head"><h2>AP &amp; lien clock <span class="count" id="liensNote"></span></h2></div>
        <div class="kpi-row" id="liensStats"></div>
      </section>
      <div id="lienBuckets"></div>
    </div><!-- /tab: liens -->

    <!-- ══════════════ TAB: VENDORS (spend) ══════════════ -->
    <div class="tab-page" data-tab="vendors" hidden>
      <section class="widget">
        <div class="widget-head"><h2>Vendor spend <span class="count" id="vendorsNote"></span></h2></div>
        <div class="table-scroll">
          <table class="grid clickable" id="vendorTable"><thead></thead><tbody></tbody></table>
        </div>
      </section>
    </div><!-- /tab: vendors -->

  </main>

  <!-- ── Detail slide-over ──────────────────────────────────────────── -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="panel panel-right" id="detail" hidden>
    <div class="panel-head">
      <div>
        <div class="panel-title" id="detailTitle">—</div>
        <div class="panel-sub" id="detailSub"></div>
      </div>
      <div class="panel-head-actions">
        <button class="btn" id="btnCopyDetail" title="Copy this job as text">Copy</button>
        <button class="btn icon" id="btnCloseDetail" title="Close">✕</button>
      </div>
    </div>
    <div class="panel-body" id="detailBody"></div>
  </aside>

  <!-- ── Settings slide-over ────────────────────────────────────────── -->
  <aside class="panel panel-right" id="settings" hidden>
    <div class="panel-head">
      <div class="panel-title">Customize</div>
      <div class="panel-head-actions">
        <button class="btn" id="btnReset" title="Reset to defaults">Reset</button>
        <button class="btn icon" id="btnCloseSettings" title="Close">✕</button>
      </div>
    </div>
    <div class="panel-body" id="settingsBody">
      <div class="set-group">
        <h3>Appearance</h3>
        <label class="set-row">Theme
          <select id="setTheme">
            <option value="auto">Auto (system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="set-row">Accent
          <input type="color" id="setAccent">
        </label>
        <label class="set-row">Font
          <select id="setFont">
            <option value="system">System</option>
            <option value="inter">Grotesque sans</option>
            <option value="serif">Serif</option>
            <option value="mono">Monospace</option>
          </select>
        </label>
        <label class="set-row">Text size <span class="val" id="fsVal"></span>
          <input type="range" id="setFontSize" min="11" max="20" step="1">
        </label>
        <label class="set-row">Density
          <select id="setDensity">
            <option value="comfortable">Comfortable</option>
            <option value="compact">Compact</option>
          </select>
        </label>
        <label class="set-row">Width
          <select id="setWidth">
            <option value="full">Full width</option>
            <option value="boxed">Boxed</option>
          </select>
        </label>
      </div>

      <div class="set-group">
        <h3>Widgets</h3>
        <label class="chk"><input type="checkbox" id="wKpis"> Portfolio KPIs</label>
        <label class="chk"><input type="checkbox" id="wAttention"> Needs attention</label>
        <label class="chk"><input type="checkbox" id="wCosts"> Cost mix</label>
        <label class="chk"><input type="checkbox" id="wMargins"> Margins &amp; burn</label>
        <label class="chk"><input type="checkbox" id="wDivisions"> Division rollup</label>
        <label class="chk"><input type="checkbox" id="wProjects"> Projects table</label>
      </div>

      <div class="set-group">
        <h3>Table columns</h3>
        <div id="colChooser" class="col-chooser"></div>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>

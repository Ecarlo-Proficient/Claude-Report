# docker-compose.yml — invoice-sync service for Phase 1 Synology test.
#
# Run from this directory:
#   docker compose --env-file ./.env.docker up -d --build
#
# Update the service:
#   git pull && docker compose up -d --build
#
# View live logs:
#   docker compose logs -f invoice-sync
#
# Stop:
#   docker compose down

services:
  invoice-sync:
    container_name: proficient-invoice-sync
    build:
      context: ..            # project root — includes qbo_vault.py + automation-worker/
      dockerfile: docker/Dockerfile
      args:
        # Optional: match these to the UID/GID of the host user that owns the
        # bind-mounted volumes below. IT can advise.
        APP_UID: 1000
        APP_GID: 1000
    image: proficient-invoice-sync:1.0.0
    restart: unless-stopped
    env_file:
      - .env.docker          # secrets + Notion DS IDs — chmod 600 on the host

    # Persistent state and OneDrive bridge folder.
    # - /data           → named volume: rotated QBO refresh token (qbo_secrets.json)
    #                     AND /data/state (sync + CDC-deletion watermarks). Keeping
    #                     state here means CDC's changedSince survives a recreate, so
    #                     deletions aren't re-scanned from scratch each restart.
    # - /data/onedrive  → BIND MOUNT to a Synology folder that Cloud Sync mirrors to
    #                     OneDrive. The Excel mirror lands here, Cloud Sync pushes
    #                     it to OneDrive within seconds. See README "OneDrive bridge".
    # - /app/.../logs   → human-readable file logs alongside `docker logs`
    volumes:
      - invoice-sync-state:/data
      - /volume1/docker/invoice-sync/onedrive:/data/onedrive    # IT may need to adjust this path to their Cloud Sync target folder
      - invoice-sync-logs:/app/automation-worker/logs

    # Light resource caps — sized for a Synology that also runs other things.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # Health check: every 5 min, confirm the python process can at least import.
    # Real health = "log line in last interval". Phase 2 may swap to a webhook
    # /health endpoint once the receiver is in place.
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 300s
      timeout: 10s
      retries: 3

    # Docker's default json-file log driver. Keep this until IT picks a
    # centralized log collector (Grafana Loki / Synology Log Center / etc.).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  invoice-sync-state:
    name: proficient-invoice-sync-state
  invoice-sync-logs:
    name: proficient-invoice-sync-logs
